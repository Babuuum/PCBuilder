[project]
name = "pcbuilder"
version = "0.1.0"
description = "FastAPI backend for PCBuilder."
authors = [{ name = "PCBuilder Maintainers", email = "maintainers@example.com" }]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "invisible-playwright (>=0.8.2,<0.9.0)",
    "celery[redis]>=5.4,<6.0",
    "redis>=5.2,<6.0",
    "celery-types (>=0.26.0,<0.27.0)",
]

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<9.0"
pytest-asyncio = ">=0.24,<1.0"
httpx = ">=0.27,<1.0"
ruff = ">=0.6,<1.0"
black = ">=24.10,<25.0"
pre-commit = ">=4.0,<5.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py312"]
