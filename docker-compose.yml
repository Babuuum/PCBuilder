services:
  app:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://pcbuilder:pcbuilder@db:5432/pcbuilder}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-postgresql+asyncpg://pcbuilder_test:pcbuilder_test@db_test:5432/pcbuilder_test}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BROWSER_HEADLESS: ${BROWSER_HEADLESS:-true}
      DNS_BROWSER_IDENTITIES: ${DNS_BROWSER_IDENTITIES:-[]}
    ports:
      - "8000:8000"
    volumes:
      - .:/app:z
    depends_on:
      db:
        condition: service_healthy
      db_test:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  celery_worker:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    command: >-
      celery -A app.celery_app:celery_app worker
      --loglevel=${LOG_LEVEL:-INFO}
      --concurrency=5
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://pcbuilder:pcbuilder@db:5432/pcbuilder}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BROWSER_HEADLESS: ${BROWSER_HEADLESS:-true}
      DNS_BROWSER_IDENTITIES: ${DNS_BROWSER_IDENTITIES:-[]}
    volumes:
      - .:/app:z
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pcbuilder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pcbuilder}
      POSTGRES_DB: ${POSTGRES_DB:-pcbuilder}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-pcbuilder_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-pcbuilder_test}
      POSTGRES_DB: ${TEST_POSTGRES_DB:-pcbuilder_test}
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
